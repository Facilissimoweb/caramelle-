<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facilissimo Web — Studio</title>
    
    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Open Graph / Link Sharing Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Facilissimo Web — Realizzazione Siti Web Macerata" />
    <meta property="og:description" content="Progettazione e realizzazione siti web veloci, moderni e ottimizzati SEO con Intelligenza Artificiale." />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Facilissimo Web" />
    <meta name="twitter:description" content="Progettazione e realizzazione siti web veloci, moderni e ottimizzati SEO." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <!-- Google Translate standard element placeholder (hidden, as we use a custom menu) -->
    <div id="google_translate_element" style="display:none; visibility:hidden; position:absolute; top:-9999px;"></div>
    
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'it',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
